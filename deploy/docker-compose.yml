# Multi-node deployment sketch: N app instances behind a load balancer, sharing
# state via Redis (Socket.IO adapter + presence) and Postgres (persistence).
#
# WebSocket transport is forced app-side (see note) so no sticky sessions are
# required. If you re-enable HTTP long-polling, the LB must use session affinity.

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes:
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  app:
    build: ..
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:8080
      AUTH_TRUST_HOST: "true"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      # Web Push (VAPID). MUST be identical across all replicas — a subscription
      # is bound to the public key it was created with, so a mismatched replica
      # can't send to it. Generate once: `npx web-push generate-vapid-keys`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Native mobile push (APNs/FCM) — see mobile/README.md. Each platform is
      # independent; leave a set empty and that platform simply isn't sent to.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_HOST: ${APNS_HOST}
      # Inlined into the client bundle at BUILD time — see calls-production.md.
      NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL}
    depends_on: [redis, postgres]
    deploy:
      replicas: 3 # multiple nodes; the Redis adapter relays broadcasts between them

  # TURN relay for calls (docs/calls-production.md). host networking is not
  # optional: coturn needs the real client-facing IP and a wide UDP port range,
  # neither of which survives docker's userland proxy. Bring your own
  # turnserver.conf (the doc has a starting point) and open 3478/udp+tcp,
  # 5349/tcp and the relay range on the host firewall.
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    # Proxy /socket.io and / to the app replicas. With WebSocket-only transport
    # no ip_hash is needed; add `ip_hash;` to the upstream if long-polling is on.
    depends_on: [app]
